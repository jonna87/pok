<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SERMIM Inventario Móvil</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f4;color:#17201b}header{background:#101512;color:white;padding:16px;border-bottom:4px solid #1f6f43}header b{font-size:18px}.wrap{padding:14px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.tabs button,.btn{border:0;border-radius:10px;padding:11px;font-weight:700}.tabs button.on,.btn.primary{background:#1f6f43;color:#fff}.card{background:white;border:1px solid #d8dfdb;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span2{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5cf;border-radius:9px}.hidden{display:none}.row{border-top:1px solid #e5e9e7;padding:10px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#6d7771;font-size:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.tabs{grid-template-columns:1fr 1fr}}
</style></head>
<body><header><b>MAQUINADOS SERMIM</b><div>Inventario Móvil · Fase 1</div></header>
<div class="wrap">
<div class="tabs">
<button class="on" data-tab="cap">Capturar</button><button data-tab="lst">Capturas</button><button data-tab="exp">Exportar</button><button data-tab="qr">QR</button>
</div>
<section id="cap" class="tab">
<div class="card"><div class="grid">
<div><label>Acción</label><select id="action"><option value="NUEVO">Nuevo artículo</option><option value="ACTUALIZAR">Actualizar existente</option></select></div>
<div><label>ID existente / QR</label><div class="toolbar"><input id="existingId" placeholder="MAT-0001" style="flex:1"><button class="btn" onclick="startScan()">Escanear</button></div></div>
<div><label>Categoría</label><select id="category" onchange="renderForm()"><option value="MATERIA_PRIMA">Materia prima</option><option value="HERRAMENTAL">Herramental</option><option value="CONSUMIBLE">Consumible</option><option value="GAS">Gas industrial</option></select></div>
<div><label>Ubicación</label><input id="loc" placeholder="RACK-A-03-N2"></div>
</div></div>
<div id="dynamic"></div>
<div class="card"><button class="btn primary" onclick="saveRecord()">Guardar captura</button> <button class="btn" onclick="clearForm()">Limpiar</button><p class="muted">Las capturas quedan guardadas en el teléfono hasta que exportes el archivo.</p></div>
</section>
<section id="lst" class="tab hidden"><div class="card"><input id="search" placeholder="Buscar..." oninput="renderList()"><div id="list"></div></div></section>
<section id="exp" class="tab hidden"><div class="card"><h2 id="count">0</h2><p>registros listos para exportar.</p><button class="btn primary" onclick="exportJson()">Exportar archivo SERMIM</button></div></section>
<section id="qr" class="tab hidden"><div class="card"><h3>Escáner QR</h3><button class="btn primary" onclick="startScan()">Abrir cámara</button><p class="muted">Si el teléfono no detecta QR automáticamente, captura el ID manualmente.</p></div></section>
</div>
<script>
const KEY='sermim_mobile_inventory_v1'; let records=JSON.parse(localStorage.getItem(KEY)||'[]');
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
qa('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function showTab(id){qa('.tab').forEach(x=>x.classList.add('hidden'));q('#'+id).classList.remove('hidden');qa('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));if(id==='lst')renderList()}
function renderForm(){const c=q('#category').value;let h='';
if(c==='MATERIA_PRIMA')h=`<div class="card"><div class="grid"><div><label>Forma</label><select id="forma"><option>REDONDO</option><option>CUADRADO</option><option>SOLERA</option><option>PLACA</option><option>TUBO / HUECO</option><option>PERFIL</option><option>OTRO</option></select></div><div><label>Material / grado</label><input id="grade" placeholder="AISI 4140"></div><div><label>Cantidad</label><input id="qty" type="number" value="1"></div><div><label>Unidad cantidad</label><select id="countUnit"><option>PZA</option><option>BARRA</option><option>PLACA</option><option>TRAMO</option></select></div><div><label>Unidad dimensional</label><select id="unit"><option>mm</option><option>in</option></select></div><div><label>Diámetro</label><input id="diam" type="number" step="any"></div><div><label>Espesor</label><input id="esp" type="number" step="any"></div><div><label>Ancho</label><input id="ancho" type="number" step="any"></div><div><label>Alto</label><input id="alto" type="number" step="any"></div><div><label>Largo</label><input id="largo" type="number" step="any"></div><div class="span2"><label>Observaciones</label><textarea id="obs"></textarea></div></div></div>`;
if(c==='HERRAMENTAL')h=`<div class="card"><div class="grid"><div><label>Tipo</label><select id="toolType"><option>BROCA</option><option>MACHUELO</option><option>FRESA</option><option>AVELLANADOR</option><option>PORTAHERRAMIENTA</option><option>OTRO</option></select></div><div><label>Sistema</label><select id="measureSystem"><option>MILIMÉTRICA</option><option>FRACCIONARIA</option><option>MÉTRICA</option><option>UNC</option><option>UNF</option><option>NPT</option></select></div><div><label>Fabricación</label><select id="toolClass"><option>LAMINADA HSS</option><option>LAMINADA COBALTO</option><option>RECTIFICADA HSS</option><option>RECTIFICADA COBALTO</option><option>CARBURO</option></select></div><div><label>Medida / rosca</label><input id="measure" placeholder="4 mm"></div><div class="span2"><label>Descripción</label><input id="grade"></div><div><label>Marca</label><input id="brand"></div><div><label>Código/modelo</label><input id="code"></div><div><label>Cantidad</label><input id="qty" type="number" value="1"></div><div><label>Unidad</label><select id="countUnit"><option>PZA</option><option>JUEGO</option><option>KIT</option></select></div><div class="span2"><label>Observaciones</label><textarea id="obs"></textarea></div></div></div>`;
if(c==='CONSUMIBLE')h=`<div class="card"><div class="grid"><div><label>Tipo</label><select id="consType"><option>GUANTES</option><option>EPP</option><option>DISCO / ABRASIVO</option><option>LIJA</option><option>INSERTO</option><option>TORNILLERÍA</option><option>LIMPIEZA</option><option>EMPAQUE</option><option>OTRO</option></select></div><div><label>Subtipo / familia</label><input id="consSubtype"></div><div class="span2"><label>Descripción</label><input id="grade"></div><div><label>Presentación / medida</label><input id="measure"></div><div><label>Cantidad</label><input id="qty" type="number" value="1"></div><div><label>Unidad</label><select id="countUnit"><option>PZA</option><option>PAR</option><option>CAJA</option><option>PAQUETE</option><option>JUEGO</option><option>ROLLO</option><option>BOLSA</option></select></div><div class="span2"><label>Observaciones</label><textarea id="obs"></textarea></div></div></div>`;
if(c==='GAS')h=`<div class="card"><div class="grid"><div><label>Gas</label><select id="gasType"><option>OXÍGENO</option><option>ARGÓN</option><option>CO₂</option><option>ACETILENO</option><option>MEZCLA</option><option>OTRO</option></select></div><div><label>Capacidad</label><input id="capacity" type="number" step="any"></div><div><label>Unidad</label><select id="capacityUnit"><option>m³</option><option>L</option><option>kg</option></select></div><div><label>Propiedad cilindro</label><select id="ownership"><option>PROPIO</option><option>PROVEEDOR</option><option>RENTA</option></select></div><div><label>Cilindros llenos</label><input id="qty" type="number" value="1"></div><div class="span2"><label>Observaciones</label><textarea id="obs"></textarea></div></div></div>`;q('#dynamic').innerHTML=h}
function v(id){return q('#'+id)?.value||''} function n(id){return +v(id)||0}
function gather(){const c=v('category');let d={loc:v('loc'),obs:v('obs'),qty:n('qty'),countUnit:v('countUnit')||'PZA'};if(c==='MATERIA_PRIMA')Object.assign(d,{cat:'MATERIA PRIMA',forma:v('forma'),grade:v('grade'),unit:v('unit'),diam:v('diam'),esp:v('esp'),ancho:v('ancho'),alto:v('alto'),largo:v('largo')});if(c==='HERRAMENTAL')Object.assign(d,{cat:'HERRAMENTAL',grade:v('grade'),toolType:v('toolType'),measureSystem:v('measureSystem'),toolClass:v('toolClass'),measure:v('measure'),brand:v('brand'),code:v('code'),returnable:true});if(c==='CONSUMIBLE')Object.assign(d,{cat:v('consType')==='INSERTO'?'INSERTO':'CONSUMIBLE',grade:v('grade'),consType:v('consType'),consSubtype:v('consSubtype'),measure:v('measure'),returnable:false});if(c==='GAS')Object.assign(d,{cat:'GAS INDUSTRIAL',grade:v('gasType'),gasType:v('gasType'),capacity:n('capacity'),capacityUnit:v('capacityUnit'),ownership:v('ownership'),full:n('qty'),inUse:0,empty:0,recharge:0});return d}
function saveRecord(){const c=v('category'),d=gather();if(c!=='GAS'&&!d.grade)return alert('Captura la descripción/material.');if(v('action')==='ACTUALIZAR'&&!v('existingId').trim())return alert('Captura o escanea el ID existente.');records.push({mobileId:'MOB-'+Date.now(),action:v('action'),existingId:v('existingId').trim().toUpperCase(),category:c,capturedAt:new Date().toISOString(),data:d});localStorage.setItem(KEY,JSON.stringify(records));refresh();clearForm();alert('Captura guardada.')}
function clearForm(){q('#action').value='NUEVO';q('#existingId').value='';q('#loc').value='';renderForm()}
function refresh(){q('#count').textContent=records.length}
function renderList(){const s=(q('#search').value||'').toLowerCase();const arr=records.filter(r=>JSON.stringify(r).toLowerCase().includes(s));q('#list').innerHTML=arr.map(r=>`<div class="row"><b>${r.data.grade||''}</b><div>${r.category} · ${r.data.qty||r.data.full||0} ${r.data.countUnit||'cil.'} · ${r.data.loc||'SIN UBICACIÓN'}</div><div class="muted">${r.existingId?'ID: '+r.existingId:''}</div><button class="btn" onclick="del('${r.mobileId}')">Eliminar</button></div>`).join('')||'<p class="muted">Sin capturas.</p>'}
function del(id){records=records.filter(r=>r.mobileId!==id);localStorage.setItem(KEY,JSON.stringify(records));refresh();renderList()}
function exportJson(){if(!records.length)return alert('No hay capturas.');const payload={tipo_archivo:'SERMIM_INVENTARIO_MOVIL',version:1,fecha_exportacion:new Date().toISOString(),usuario:'Robles',registros:records};const name='SERMIM_INVENTARIO_MOVIL_'+new Date().toISOString().slice(0,10)+'.json';const txt=JSON.stringify(payload,null,2);if(window.Android?.exportJson)Android.exportJson(txt,name)}
async function startScan(){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const video=document.createElement('video');video.setAttribute('playsinline','');video.srcObject=stream;await video.play();if(!('BarcodeDetector' in window)){stream.getTracks().forEach(t=>t.stop());return alert('QR automático no disponible. Captura el ID manualmente.')}const det=new BarcodeDetector({formats:['qr_code']});let tries=0;const timer=setInterval(async()=>{tries++;const codes=await det.detect(video).catch(()=>[]);if(codes.length){clearInterval(timer);stream.getTracks().forEach(t=>t.stop());q('#existingId').value=codes[0].rawValue.trim().toUpperCase();q('#action').value='ACTUALIZAR';alert('QR leído: '+q('#existingId').value)}else if(tries>40){clearInterval(timer);stream.getTracks().forEach(t=>t.stop());alert('No se detectó QR. Intenta de nuevo.')}},250)}catch(e){alert('No se pudo abrir la cámara: '+e.message)}}
renderForm();refresh();
</script></body></html>
